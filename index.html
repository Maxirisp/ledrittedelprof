    <div class="container">
        <h1>Live Scores</h1>
        <iframe id="sofascore-widget"

// ═══════════════════════════════════════════════════════
// SOFASCORE WIDGET CONTROLLER
// ═══════════════════════════════════════════════════════



// IDs tornei SofaScore (uniqueTournamentId)
var SS_LEAGUES = {
  'all':        null,   // nessun filtro = tutti i tornei del giorno
  'serie-a':    23,
  'premier':    17,
  'laliga':     8,
  'bundesliga': 35,
  'ligue1':     34,
  'champions':  7,
  'europa':     679
};

var _ssCurrentDate   = new Date();
var _ssCurrentLeague = 'all';

function _ssFormatDate(d) {
  var yr  = d.getFullYear();
  var mo  = ('0' + (d.getMonth()+1)).slice(-2);
  var day = ('0' + d.getDate()).slice(-2);
  return yr + '-' + mo + '-' + day;
}



function _ssBuildIframeSrc(date, leagueKey) {
  // Base URL del widget SofaScore Fixtures
  // Per generare un URL specifico per i tuoi tornei preferiti vai su:
  // https://widgets.sofascore.com/config/fixtures
  var base = 'https://widgets.sofascore.com/embed/fixtures?sport=football&theme=dark&lang=it';
  if (date) base += '&date=' + date;
  var tid = SS_LEAGUES[leagueKey];
  if (tid) base += '&uniqueTournamentId=' + tid;
  return base;
}

function _ssUpdateWidget() {
  var iframe = document.getElementById('sofascore-fixtures-iframe');
  if (!iframe) return;
  var dateStr = _ssFormatDate(_ssCurrentDate);
  iframe.src  = _ssBuildIframeSrc(dateStr, _ssCurrentLeague);

  // Aggiorna anche label data
  var now = new Date();
  var label = document.getElementById('ssDateLabel');
  if (label) {
    var isToday = _ssCurrentDate.getDate()  === now.getDate() &&
                  _ssCurrentDate.getMonth() === now.getMonth();
    if (isToday) {
      label.textContent = 'OGGI · ' + dateStr;
    } else {
      var giorni = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
      label.textContent = giorni[_ssCurrentDate.getDay()] + ' ' + dateStr;
    }
  }
}

function ssShiftDate(delta) {
  _ssCurrentDate = new Date(
    _ssCurrentDate.getFullYear(),
    _ssCurrentDate.getMonth(),
    _ssCurrentDate.getDate() + delta
  );
  _ssUpdateWidget();
}

function ssSelectLeague(btn, leagueKey) {
  document.querySelectorAll('.ss-league-tab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  _ssCurrentLeague = leagueKey;
  _ssUpdateWidget();
}

function ssReloadWidget() {
  // Forza reload dell'iframe aggiungendo un timestamp
  var iframe = document.getElementById('sofascore-fixtures-iframe');
  if (!iframe) return;
  var dateStr = _ssFormatDate(_ssCurrentDate);
  iframe.src = _ssBuildIframeSrc(dateStr, _ssCurrentLeague) + '&_t=' + Date.now();
}

// ═══════════════════════════════════════════════════════
// FETCH PARTITE LIVE/OGGI — backend GAS (fallback)
// ═══════════════════════════════════════════════════════
var _liveData = [];

function caricaPartiteOggi() {
  var container = document.getElementById('live-games-container');
  if (!container) return;

  if (!IS_GAS) {
    renderPartiteOggi([], new Date().toISOString().slice(0,10));
    return;
  }

  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success) {
        _liveData = r.data || [];
        // Mostra solo se il widget SofaScore non è disponibile
        renderPartiteOggi(r.data, r.date);
      }
    })
    .withFailureHandler(function(e) {
      console.warn('GAS partiteOggi:', e);
    })
    .getFixturesToday();
}

function buildDatePillsStatic() {
  var container = document.getElementById('hdrDatesApp');
  if (!container) return;
  var now = new Date();
  var h = '';
  for (var i = -1; i <= 4; i++) {
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    var isToday = (i === 0);
    var giorni = ['DOM','LUN','MAR','MER','GIO','VEN','SAB'];
    var giornoStr = isToday ? 'OGGI' : giorni[d.getDay()];
    var ds = pad(d.getDate()) + '/' + pad(d.getMonth()+1);
    var dataApi = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
    h += '<div class="date-box ' + (isToday ? 'active' : '') + '" data-d="' + ds + '" data-date="' + dataApi + '" onclick="filterDate(this)">' +
         '<span class="date-day">' + giornoStr + '</span>' +
         '<span class="date-num">' + d.getDate() + '</span>' +
         '</div>';
  }
  container.innerHTML = h;
}

function renderPartiteOggi(fixtures, dataStr) {
  var container = document.getElementById('live-games-container');
  if (!container) return;
  if (!fixtures || !fixtures.length) return; // se vuoto non mostrare il container GAS

  container.style.display = 'block';

  var byLeague = {};
  fixtures.forEach(function(f) {
    var lname = f.league.name;
    if (!byLeague[lname]) byLeague[lname] = { league: f.league, fixtures: [] };
    byLeague[lname].fixtures.push(f);
  });

  var h = '<div style="padding: 0 0 60px;">';
  Object.values(byLeague).forEach(function(group) {
    var lg = group.league;
    h += '<div class="league-hdr-app">' +
      '<img src="' + lg.logo + '" style="width:20px;height:20px;object-fit:contain">' +
      '<span style="margin-left:6px">' + lg.name + '</span>' +
      '<span style="color:#aaa;font-size:11px;margin-left:4px">· ' + lg.country + '</span>' +
    '</div>';
    group.fixtures.forEach(function(f, i) {
      var s = f.fixture.status;
      var home = f.teams.home, away = f.teams.away, goals = f.goals;
      var statusLabel = '', statusColor = '#888';
      if (s.short === 'NS') {
        var d = new Date(f.fixture.date);
        statusLabel = pad(d.getHours()) + ':' + pad(d.getMinutes());
        statusColor = '#0A3654';
      } else if (s.short === 'FT' || s.short === 'AET' || s.short === 'PEN') {
        statusLabel = 'FT'; statusColor = '#888';
      } else if (s.short === 'HT') {
        statusLabel = 'HT'; statusColor = '#e67e22';
      } else if (s.elapsed) {
        statusLabel = s.elapsed + "'"; statusColor = '#e74c3c';
      } else { statusLabel = s.short; }

      var isLive = ['1H','2H','ET','P','HT'].indexOf(s.short) !== -1;
      var scoreHome = goals.home !== null ? goals.home : '-';
      var scoreAway = goals.away !== null ? goals.away : '-';

      h += '<div class="bm-match" style="animation-delay:' + (i*0.04) + 's' + (isLive ? ';border-left:3px solid #e74c3c' : '') + '">' +
        '<div class="bm-left">' +
          '<div class="bm-time" style="background:' + statusColor + ';font-size:10px">' + statusLabel + '</div>' +
          (isLive ? '<div style="font-size:9px;color:#e74c3c;font-weight:700;margin-top:4px">LIVE</div>' : '') +
        '</div>' +
        '<div class="bm-center">' +
          '<div class="bm-team"><img src="' + home.logo + '" style="width:20px;height:20px;object-fit:contain;margin-right:8px" onerror="this.style.display=\'none\'"><span style="flex:1">' + home.name + '</span><span class="bm-score" style="' + (home.winner ? 'color:#22c55e;font-weight:900' : '') + '">' + scoreHome + '</span></div>' +
          '<div class="bm-team"><img src="' + away.logo + '" style="width:20px;height:20px;object-fit:contain;margin-right:8px" onerror="this.style.display=\'none\'"><span style="flex:1">' + away.name + '</span><span class="bm-score" style="' + (away.winner ? 'color:#22c55e;font-weight:900' : '') + '">' + scoreAway + '</span></div>' +
        '</div>' +
      '</div>';
    });
  });
  h += '</div>';
  container.innerHTML = h;
}

// ═══════════════════════════════════════════════════════
// FONT SIZE
// ═══════════════════════════════════════════════════════
var _fontBase = 7;
function _applyFont(){
  document.documentElement.style.fontSize = _fontBase + 'px';
  try { localStorage.setItem('dritte_font', _fontBase); } catch(e) {}
  requestAnimationFrame(updateHeaderHeight);
}
function aumentaFont(){ _fontBase = Math.min(21, _fontBase+2); _applyFont(); }
function riduciFont(){ var m = _isDesktop() ? 11 : 5; _fontBase = Math.max(m, _fontBase-2); _applyFont(); }
function _isDesktop(){ return window.matchMedia('(min-width:768px) and (pointer:fine)').matches; }
(function(){
  try {
    var d = window.matchMedia('(min-width:768px) and (pointer:fine)').matches;
    var def = d ? 15 : 9;
    var s = parseInt(localStorage.getItem('dritte_font') || String(def));
    if (s >= 5 && s <= 21) { _fontBase = s; document.documentElement.style.fontSize = s + 'px'; }
    else { _fontBase = def; document.documentElement.style.fontSize = def + 'px'; }
  } catch(e) {}
})();

// ═══════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════
var LEAGUE_FLAGS = {
  'serie a':'🇮🇹','serie b':'🇮🇹','ligue 1':'🇫🇷','ligue 2':'🇫🇷',
  'premier league':'🏴','laliga':'🇪🇸','la liga':'🇪🇸',
  'bundesliga':'🇩🇪','2. bundesliga':'🇩🇪','eredivisie':'🇳🇱',
  'eerste':'🇳🇱','swiss super league':'🇨🇭','swiss league':'🇨🇭',
  'süper lig':'🇹🇷','super lig':'🇹🇷','danish superliga':'🇩🇰',
  'pro league':'🇧🇪','primeira liga':'🇵🇹',
  'champions league':'🏆','europa league':'🏆','conference league':'🏆',
  'saudi pro league':'🇸🇦','scottish premiership':'🏴',
  'austrian bundesliga':'🇦🇹','super league':'🇬🇷'
};
function getFlag(m){
  if(!m)return'🏆';
  if(m.flag&&m.flag.trim()&&m.flag.trim()!=='🏆')return m.flag.trim();
  var c=(m.campionato||'').toLowerCase().trim();
  if(!c)return'🏆';
  if(LEAGUE_FLAGS[c])return LEAGUE_FLAGS[c];
  for(var k in LEAGUE_FLAGS)if(c.includes(k)||k.includes(c))return LEAGUE_FLAGS[k];
  return'🏆';
}
function np(v){if(typeof v!=='number'||v<=0)return 0;return v>0&&v<=1?Math.round(v*100):Math.round(v);}
function nds(raw){
  if(!raw)return'-';
  if(typeof raw==='string'){if(raw.includes('GMT')||raw.includes('T')){var d=new Date(raw);if(!isNaN(d.getTime()))return pad(d.getDate())+'/'+pad(d.getMonth()+1)}return raw;}
  if(raw instanceof Date&&!isNaN(raw.getTime()))return pad(raw.getDate())+'/'+pad(raw.getMonth()+1);
  return String(raw);
}
function nora(raw,dataRaw){
  if(raw&&typeof raw==='string'&&raw!=='-'&&!raw.includes('GMT')&&!raw.includes('T'))return raw;
  var src=raw||dataRaw;if(src){var d=new Date(src);if(!isNaN(d.getTime()))return pad(d.getHours())+':'+pad(d.getMinutes());}
  return'-';
}
function pad(n){return('0'+n).slice(-2);}
function probBarColor(p){if(p>=75)return'#c8f135';if(p>=65)return'#22c55e';if(p>=55)return'#3b82f6';return'#f97316';}
function getMBClass(m){
  var s=(m||'').toLowerCase();
  if(s==='1x2')return'sa-mb-1x2';if(s==='o/u'||s.includes('over'))return'sa-mb-ou';
  if(s==='gg/ng')return'sa-mb-ggng';if(s.includes('corner'))return'sa-mb-corner';
  if(s.includes('card'))return'sa-mb-cards';if(s.includes('mg'))return'sa-mb-mg';
  return'sa-mb-default';
}
function emp(ico,txt){return'<div class="empty"><div class="empty-ico">'+ico+'</div><div class="empty-txt">'+txt+'</div></div>';}
function qDisplay(m){
  if(m.quota&&m.quota>1)return{val:typeof m.quota.toFixed==='function'?m.quota.toFixed(2):m.quota,isReal:!!m.quotaReale&&m.quotaReale>1};
  if(m.quotaReale&&m.quotaReale>1)return{val:m.quotaReale.toFixed(2),isReal:true};
  var p=np(m.prob);if(!p)return{val:'-',isReal:false};
  return{val:(100/p).toFixed(2),isReal:false};
}
function groupByLeague(arr){
  var map={};
  arr.forEach(function(m){var n=m.campionato||'Altro';if(!map[n])map[n]={flag:getFlag(m),name:n,matches:[]};map[n].matches.push(m);});
  return Object.values(map);
}

// ═══════════════════════════════════════════════════════
// FILTRO PARTITE FUTURE + SOLO OGGI
// ═══════════════════════════════════════════════════════
function isPartitaFutura(m){
  try{
    var ds=m.dataStr||m.data;
    if(typeof ds==='string'&&(ds.includes('T')||ds.includes('GMT'))){var d=new Date(ds);if(!isNaN(d.getTime()))return d>new Date();}
    var dsStr=nds(ds),ora=nora(m.oraStr,ds);
    if(!dsStr||dsStr==='-')return true;
    var pts=dsStr.split('/');if(pts.length<2)return true;
    var tp=(ora&&ora!=='-')?ora.split(':'):['23','59'];
    var now=new Date(),yr=now.getFullYear(),mo=parseInt(pts[1])-1;
    if(mo<now.getMonth()-3)yr++;
    var kickoff=new Date(yr,mo,parseInt(pts[0]),parseInt(tp[0])||0,parseInt(tp[1])||0,0);
    return kickoff>now;
  }catch(e){return true;}
}
function isPartitaOggi(m){
  try{
    var ds=m.dataStr||m.data;
    var now=new Date();
    var dsStr=nds(ds);
    if(!dsStr||dsStr==='-')return false;
    var pts=dsStr.split('/');if(pts.length<2)return false;
    return parseInt(pts[0])===now.getDate()&&parseInt(pts[1])-1===now.getMonth();
  }catch(e){return false;}
}

// ═══════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════
var SECTIONS_WITH_FILTERS=['s-top5','s-top7','s-corner','s-cards','s-mg','s-dcover','s-over25','s-league'];
var analistaAIData=null, analistaAITs='';

function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('open');document.body.style.overflow='hidden';}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('open');document.body.style.overflow='';}

var currentSection = 's-widget-live';
var activeDateFilter = 'all';

function activateSection(sid) {
  currentSection = sid;
  document.querySelectorAll('.section').forEach(function(s){ s.classList.remove('active'); });
  var el = document.getElementById(sid);
  if (el) el.classList.add('active');
  document.querySelectorAll('.op-bn-item').forEach(function(btn) {
    var oc = btn.getAttribute('onclick');
    if (oc && oc.indexOf(sid) !== -1) btn.classList.add('active');
    else btn.classList.remove('active');
  });
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// ═══════════════════════════════════════════════════════
// filterDate — UNICA definizione, aggiorna SofaScore iframe
// ═══════════════════════════════════════════════════════
function filterDate(btn) {
  // Evidenzia pill selezionata
  document.querySelectorAll('.date-box').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');

  var dataApi  = btn.getAttribute('data-date'); // es. "2026-05-07"
  var dataProno = btn.getAttribute('data-d');    // es. "07/05"

  // ── Aggiorna iframe SofaScore ──
  if (dataApi) {
    var d = new Date(dataApi);
    _ssCurrentDate = d;
    _ssUpdateWidget();
  }

  // ── Aggiorna filtro pronostici interni ──
  activeDateFilter = dataProno || 'all';

  if (typeof renderTutto === 'function') renderTutto();
}

function updateHeaderHeight(){var hh=document.getElementById('appHeader').offsetHeight;document.getElementById('mainContent').style.paddingTop=hh+'px';document.getElementById('filterBar').style.top=hh+'px';}
function goTo(btn){activateSection(btn.dataset.s);closeSidebar();}
function goToTab(btn){activateSection(btn.dataset.s);}

var adminClicks=0,adminTimer=null;
function handleAdminClick(){
  adminClicks++;if(adminTimer)clearTimeout(adminTimer);
  adminTimer=setTimeout(function(){adminClicks=0;},2000);
  if(adminClicks===5){document.getElementById('adminPanel').style.display='block';window.scrollTo({top:0,behavior:'smooth'});logAdmin('Dev Mode');adminClicks=0;}
}
function logAdmin(msg){var c=document.getElementById('adminConsole');c.innerHTML='['+new Date().toLocaleTimeString()+'] '+msg+'<br>'+c.innerHTML;}
function runTask(fn,lbl){
  logAdmin('Avvio: '+lbl+'...');
  document.querySelectorAll('.admin-btn').forEach(function(b){b.disabled=true;});
  try{
    google.script.run
      .withSuccessHandler(function(){logAdmin('OK: '+lbl);document.querySelectorAll('.admin-btn').forEach(function(b){b.disabled=false;});if(fn==='generaPalinsestoV3')caricaDati();})
      .withFailureHandler(function(e){logAdmin('ERR: '+(e.message||e));document.querySelectorAll('.admin-btn').forEach(function(b){b.disabled=false;});})[fn]();
  }catch(e){logAdmin('Non disponibile');document.querySelectorAll('.admin-btn').forEach(function(b){b.disabled=false;});}
}

function filterMatches(arr){
  if(activeDateFilter==='all')return arr||[];
  return(arr||[]).filter(function(m){return nds(m.dataStr||m.data)===activeDateFilter;});
}

// ═══════════════════════════════════════════════════════
// DATA SOURCES — allineati con PALINSESTO_V3
// ═══════════════════════════════════════════════════════
var DATA_SOURCES=['top5Oggi','top7Prossimi','topSerieA','top7_Corner','top7_Cards',
  'top7_MGCasa','top7_MGOspite','top10_DCOver','topOver35'];
var palinsestoData=null;
var IS_GAS=typeof google!=='undefined'&&typeof google.script!=='undefined';

function _getVal(obj, keys) {
  for(var k in obj) {
    var cleanK = k.toLowerCase().replace(/[^a-z0-9]/g, '');
    for(var i=0; i<keys.length; i++) {
      if(cleanK === keys[i]) {
        var val = obj[k];
        if(val !== null && val !== undefined && val !== '') return String(val);
      }
    }
  }
  return '-';
}

function getAllMatches(){
  if(!palinsestoData) return [];
  var all=[];
  var seen = new Set();
  for(var listName in palinsestoData){
    if(Array.isArray(palinsestoData[listName])){
      palinsestoData[listName].forEach(function(m){
        m.casa = m.casa && m.casa !== '-' ? m.casa : _getVal(m, ['sqcasa', 'casa']);
        m.ospite = m.ospite && m.ospite !== '-' ? m.ospite : _getVal(m, ['sqospite', 'ospite']);
        m.dataStr = m.dataStr && m.dataStr !== '-' ? m.dataStr : _getVal(m, ['dataeorapartita', 'dataora', 'datastr', 'data']);
        m.pronostico = m.pronostico && m.pronostico !== '-' ? m.pronostico : _getVal(m, ['best5combo', 'pronostico', 'best']);
        var k = m.casa + '_' + m.ospite;
        if(m.casa !== '-' && !seen.has(k)){seen.add(k);all.push(m);}
      });
    }
  }
  return all;
}

function getPartiteOggi(){
  var all=getAllMatches().filter(isPartitaFutura).filter(isPartitaOggi);
  var seen={};var res=[];
  all.forEach(function(m){
    var k=(m.casa||'')+'_'+(m.ospite||'');
    if(!seen[k]){seen[k]=true;res.push({casa:m.casa,ospite:m.ospite,campionato:m.campionato,dataStr:m.dataStr,oraStr:m.oraStr,data:m.data,idPartita:m.idPartita||m.id||k});}
  });
  return res;
}
function getPartiteFuture(){
  var all=getAllMatches().filter(isPartitaFutura);
  var seen={};var res=[];
  all.forEach(function(m){var k=(m.casa||'')+'_'+(m.ospite||'');if(!seen[k]){seen[k]=true;res.push({casa:m.casa,ospite:m.ospite,campionato:m.campionato,dataStr:m.dataStr,oraStr:m.oraStr,data:m.data,idPartita:m.idPartita||m.id||k});}});
  return res;
}

function caricaDati() {
  var sezioniConLoader = ['s-top5','s-top7','s-raddoppio','s-sistema',
    's-sistema3f3d','s-dcover','s-over25','s-corner','s-cards',
    's-mg','s-seriea-top','s-foglio-prono'];
  sezioniConLoader.forEach(function(sid) {
    var el = document.getElementById(sid);
    if(el) el.innerHTML = '<div class="loading" style="padding:3em 1em"><div class="spinner"></div><div class="loading-txt">Caricamento...</div></div>';
  });

  if(!IS_GAS){
    palinsestoData = typeof DEMO !== 'undefined' ? JSON.parse(JSON.stringify(DEMO)) : {};
    buildDatePills(); renderTutto(); caricaAnalistaAI();
    return;
  }

  palinsestoData = {
    raddoppio:[], sistema2su3:null, sistema3f3d:null,
    top5Oggi:[], topMyCombo5:[], top7Prossimi:[], topSerieA:[],
    top10_DCOver:[], topOver35:[], top7_Corner:[], top7_Cards:[],
    top7_MGCasa:[], top7_MGOspite:[], mlInfo:null
  };

  var done = 0, total = 3;
  function tick() {
    done++;
    if(done >= total) { buildDatePills(); renderTutto(); caricaAnalistaAI(); }
  }

  google.script.run
    .withSuccessHandler(function(r) {
      if(r && r.success && r.data) { Object.assign(palinsestoData, r.data); if(r.timestamp) aggTs(r.timestamp); }
      tick();
    })
    .withFailureHandler(function(e) { console.error('Cache', e); tick(); })
    .getPalinsestoV3API();

  google.script.run
    .withSuccessHandler(function(r) { if(r && r.success) Object.assign(palinsestoData, r.data); tick(); })
    .withFailureHandler(function(e) { console.error('Base', e); tick(); })
    .caricaDatiBase();

  google.script.run
    .withSuccessHandler(function(r) { if(r && r.success) Object.assign(palinsestoData, r.data); tick(); })
    .withFailureHandler(function(e) { console.error('Top7', e); tick(); })
    .caricaDatiTop7();

  setTimeout(function() {
    if(done < total) { buildDatePills(); renderTutto(); caricaAnalistaAI(); }
  }, 20000);
}

function aggTs(ts){
  var d = new Date(ts);
  var s = 'Agg. ' + d.toLocaleDateString('it-IT') + ' ' + d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  var elSbUpdate = document.getElementById('sbUpdate');
  var elHdrTimestamp = document.getElementById('hdrTimestamp');
  if (elSbUpdate) elSbUpdate.textContent = s;
  if (elHdrTimestamp) elHdrTimestamp.textContent = s;
}

var GIORNI_IT_SHORT = ['DOM','LUN','MAR','MER','GIO','VEN','SAB'];

function buildDatePills() {
  var allData = getAllMatches(), dateSet = {};
  allData.forEach(function(m) {
    var ds = nds(m.dataStr || m.data);
    if(ds && ds !== '-') dateSet[ds] = true;
  });
  var dates = Object.keys(dateSet);
  if (dates.length === 0) return;
  dates.sort(function(a, b) {
    var pa = a.split('/'), pb = b.split('/');
    return new Date(2026, parseInt(pa[1])-1, parseInt(pa[0])) -
           new Date(2026, parseInt(pb[1])-1, parseInt(pb[0]));
  });
  var now = new Date();
  var oggi0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  dates = dates.filter(function(ds) {
    var p = ds.split('/');
    return new Date(now.getFullYear(), parseInt(p[1])-1, parseInt(p[0])).getTime() >= oggi0;
  });
  if (dates.length === 0) return;

  var h = '';
  dates.forEach(function(ds) {
    var p = ds.split('/');
    var d = new Date(now.getFullYear(), parseInt(p[1])-1, parseInt(p[0]));
    var isToday = (d.getDate() === now.getDate() && d.getMonth() === now.getMonth());
    var giornoStr = isToday ? 'OGGI' : GIORNI_IT_SHORT[d.getDay()];
    var dataApi = now.getFullYear() + '-' + pad(parseInt(p[1])) + '-' + pad(parseInt(p[0]));
    h += '<div class="date-box ' + (isToday ? 'active' : '') + '" data-d="' + ds + '" data-date="' + dataApi + '" onclick="filterDate(this)">' +
         '<span class="date-day">' + giornoStr + '</span>' +
         '<span class="date-num">' + p[0] + '</span>' +
         '</div>';
  });

  var container = document.getElementById('hdrDatesApp');
  if (container) container.innerHTML = h;
}

function getAllAggregatedMatches() {
  if (!palinsestoData) return [];
  var seen = {};
  var now = new Date();

  function processMatch(m) {
    if (!m || typeof m !== 'object') return;
    var casa   = m.casa   || m.sqcasa   || '';
    var ospite = m.ospite || m.sqospite || '';
    if (!casa || casa === '-') return;
    var k = casa + '_' + ospite;

    if (!seen[k]) {
      seen[k] = {
        info: { casa:casa, ospite:ospite, campionato:m.campionato||'', dataStr:m.dataStr||m.data||'', oraStr:m.oraStr||'', data:m.data||'' },
        tips: { best:'-', '1x2':'-', ou:'-', corner:'-', cards:'-', tiri:'-', falli:'-' }
      };
    }

    var info = seen[k].info;
    if (!info.campionato && m.campionato) info.campionato = m.campionato;
    if (!info.dataStr && (m.dataStr || m.data)) info.dataStr = m.dataStr || m.data;
    if (!info.oraStr  &&  m.oraStr)             info.oraStr  = m.oraStr;
    if (!info.data    &&  m.data)               info.data    = m.data;

    var t = seen[k].tips;
    var pr  = (m.pronostico || '').toString().trim();
    var prU = pr.toUpperCase().replace(/\s+/g, '');
    var merc = (m.mercato || '').toLowerCase();

    if (m.consiglio1X2    && t['1x2']  === '-') t['1x2']  = m.consiglio1X2;
    if (m.consiglioOU     && t.ou      === '-') t.ou      = m.consiglioOU;
    if (m.consiglioCorner && t.corner  === '-') t.corner  = m.consiglioCorner;
    if (m.consiglioCards  && t.cards   === '-') t.cards   = m.consiglioCards;
    if (m.consiglioTiri   && t.tiri    === '-') t.tiri    = m.consiglioTiri;
    if (m.consiglioFalli  && t.falli   === '-') t.falli   = m.consiglioFalli;
    var bestStr = m.best5combo || m.myCombo5 || '';
    if (bestStr && t.best === '-') t.best = bestStr;

    if (pr && pr !== '-') {
      if (merc.includes('corner') || prU.includes('CORNER')) { if (t.corner === '-') t.corner = pr; }
      else if (merc.includes('card') || prU.includes('CARD')) { if (t.cards === '-') t.cards = pr; }
      else if (merc.includes('tiri')) { if (t.tiri === '-') t.tiri = pr; }
      else if (merc.includes('falli')) { if (t.falli === '-') t.falli = pr; }
      else if (prU === '1X' || prU === 'X2' || prU === '12') { if (t['1x2'] === '-') t['1x2'] = pr; }
      else if (prU === '1' || prU === 'X' || prU === '2' || merc === '1x2') { if (t['1x2'] === '-') t['1x2'] = pr; }
      else if (pr.includes('+')) { if (t.best === '-') t.best = pr; }
      else if (merc.includes('o/u') || merc.includes('over') || merc.includes('under') || merc.includes('mg') || prU.startsWith('OVER') || prU.startsWith('UNDER') || prU === 'GG' || prU === 'NG') { if (t.ou === '-') t.ou = pr; }
      else { if (t.best === '-') t.best = pr; }
    }
  }

  ['top5Oggi','top7Prossimi','topSerieA','top7_Corner','top7_Cards',
   'top7_MGCasa','top7_MGOspite','top10_DCOver','topOver35','topMyCombo5']
  .forEach(function(l) { (palinsestoData[l] || []).forEach(processMatch); });

  (palinsestoData.raddoppio || []).forEach(function(card) {
    (card.pick || card.partite || []).forEach(processMatch);
  });
  var s2 = palinsestoData.sistema2su3;
  if (s2 && s2.terzetti) s2.terzetti.forEach(function(tz) { (tz.pick || []).forEach(processMatch); });
  var s3 = palinsestoData.sistema3f3d;
  if (s3) { (s3.fisse || []).forEach(processMatch); (s3.doppie || []).forEach(processMatch); }

  var agg = Object.values(seen);
  agg.forEach(function(row) {
    var m = row.info;
    var rawDate = m.dataStr || m.data;
    var ds = nds(rawDate);
    var ora = nora(m.oraStr, rawDate);
    row.ds = ds; row.ora = ora; row.ts = Infinity;
    if (ds && ds !== '-') {
      var pts = ds.split('/');
      if (pts.length >= 2) {
        var tp = (ora && ora !== '-') ? ora.split(':') : ['23','59'];
        var yr = now.getFullYear(), mo = parseInt(pts[1]) - 1;
        if (mo < now.getMonth() - 3) yr++;
        var d = new Date(yr, mo, parseInt(pts[0]), parseInt(tp[0])||23, parseInt(tp[1])||59, 0);
        if (!isNaN(d.getTime())) row.ts = d.getTime();
      }
    }
  });
  return agg;
}

// ── TABELLA PRONOSTICI ──
function renderFoglioPronostici(){
  var el = document.getElementById('s-foglio-prono');
  if(!el) return;
  var agg = getAllAggregatedMatches();
  var now = new Date();
  agg.forEach(function(row){
    var ds = nds(row.info.dataStr || row.info.data);
    var ora = nora(row.info.oraStr, row.info.dataStr || row.info.data);
    row.ds = ds; row.ora = ora;
    if (ds === '-') { row.ts = Infinity; return; }
    var pts = ds.split('/');
    var tp = ora !== '-' ? ora.split(':') : [23,59];
    var yr = now.getFullYear(), mo = parseInt(pts[1])-1;
    if (mo < now.getMonth() - 3) yr++;
    row.ts = new Date(yr, mo, parseInt(pts[0]), parseInt(tp[0]), parseInt(tp[1]), 0).getTime();
  });
  agg.sort(function(a,b){ return a.ts - b.ts; });

  var h = '<div class="sec-hdr"><div class="sec-title">📊 Tabella Pronostici</div><div class="sec-sub">Tutti i consigli aggregati e ordinati per orario</div></div>';
  if(!agg.length){ el.innerHTML = h + emp('📊','Nessun pronostico disponibile.'); return; }

  h += '<div class="table-wrapper"><table class="prono-table" style="font-size:0.85em; width:100%;">';
  h += '<thead><tr><th style="text-align:center">Data/Ora</th><th>Partita</th><th style="text-align:center">Best</th><th style="text-align:center">1X2</th><th style="text-align:center">U/O</th><th style="text-align:center">Corner</th><th style="text-align:center">Cards</th><th style="text-align:center">Tiri</th><th style="text-align:center">Falli</th></tr></thead><tbody>';
  agg.forEach(function(row){
    var m = row.info, t = row.tips;
    h += '<tr>';
    h += '<td style="color:var(--txt3);text-align:center;white-space:nowrap;line-height:1.4"><span style="font-size:0.9em">' + row.ds + '</span><br><strong style="color:var(--txt);font-size:1.1em">' + row.ora + '</strong></td>';
    h += '<td style="min-width:120px">' + teamRow(m.casa,"font-size:1em;font-weight:700;") + '<div style="height:4px"></div>' + teamRow(m.ospite,"font-size:1em;font-weight:700;") + '</td>';
    h += '<td style="text-align:center"><span class="t-prono" style="background:var(--accent);color:#fff;white-space:nowrap">' + (t.best !== '-' ? t.best.substring(0,18) : '-') + '</span></td>';
    h += '<td style="font-weight:700;text-align:center;white-space:nowrap">' + t['1x2'] + '</td>';
    h += '<td style="font-weight:700;text-align:center;white-space:nowrap">' + t.ou + '</td>';
    h += '<td style="font-weight:700;text-align:center;white-space:nowrap">' + t.corner + '</td>';
    h += '<td style="font-weight:700;text-align:center;white-space:nowrap">' + t.cards + '</td>';
    h += '<td style="font-weight:700;text-align:center;white-space:nowrap">' + t.tiri + '</td>';
    h += '<td style="font-weight:700;text-align:center;white-space:nowrap">' + t.falli + '</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  el.innerHTML = h;
}

// ── Top5 oggi ──
function getTop5OggiData() {
  var seen = {}, result = [];
  function aggiungi(arr) {
    (arr || []).filter(isPartitaOggi).forEach(function(m) {
      var k = (m.casa || '') + '_' + (m.ospite || '');
      if (!seen[k] && m.casa && m.casa !== '-') { seen[k] = true; result.push(m); }
    });
  }
  aggiungi(palinsestoData.top5Oggi);
  if (result.length < 5) aggiungi(palinsestoData.top7Prossimi);
  if (result.length < 5) aggiungi(palinsestoData.topSerieA);
  if (result.length < 5) aggiungi(palinsestoData.top10_DCOver);
  if (result.length < 5) aggiungi(palinsestoData.topOver35);
  if (result.length < 5) {
    getAllMatches().filter(isPartitaOggi).forEach(function(m) {
      var k = (m.casa || '') + '_' + (m.ospite || '');
      if (!seen[k] && m.casa && m.casa !== '-' && np(m.prob) > 0) { seen[k] = true; result.push(m); }
    });
    result.sort(function(a, b) { return np(b.prob) - np(a.prob); });
  }
  return result.slice(0, 5);
}

function matchCard(m, idx) {
  var q = qDisplay(m);
  var ora = nora(m.oraStr, m.dataStr || m.data);
  var p = np(m.prob);
  var pickLabel = "1X2";
  var pickValue = m.pronostico || "-";
  if (pickValue.indexOf("X") !== -1) pickLabel = "Doppia chance";
  if (pickValue.indexOf("Under") !== -1 || pickValue.indexOf("Over") !== -1) pickLabel = "Gol";
  if (pickValue.toLowerCase() === "gg" || pickValue.toLowerCase() === "ng") pickLabel = "Entrambe segnano";
  var timeDisplay = (!ora || ora === "-") ? "FT" : ora;
  var fallbackCasa   = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(m.casa   || 'X');
  var fallbackOspite = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(m.ospite || 'X');
  return '<div class="bm-match" style="animation-delay:' + ((idx||0)*0.04) + 's">' +
    '<div class="bm-left"><div class="bm-star">☆</div><div class="bm-time">' + timeDisplay + '</div></div>' +
    '<div class="bm-center">' +
      '<div class="bm-team"><img src="' + ottieniLogo(m.casa)   + '" alt="" onerror="this.src=\'' + fallbackCasa   + '\'"> <span>' + (m.casa   || '') + '</span><span class="bm-score">-</span></div>' +
      '<div class="bm-team"><img src="' + ottieniLogo(m.ospite) + '" alt="" onerror="this.src=\'' + fallbackOspite + '\'"> <span>' + (m.ospite || '') + '</span><span class="bm-score">-</span></div>' +
    '</div>' +
    '<div class="bm-right">' +
      '<div class="bm-prob">' + (p > 0 ? p + '%' : '-') + '</div>' +
      '<div class="bm-pick"><span class="bm-pick-lbl">' + pickLabel + '</span><span class="bm-pick-val">' + pickValue + '</span></div>' +
      '<div class="bm-quota">' + q.val + '</div>' +
    '</div>' +
  '</div>';
}

function renderLista(sid, rawData, title, sub) {

  if(!data.length) { el.innerHTML = emp('📊','Nessun pronostico'); return; }

}

function _isPronosticoFissa(m){
  var merc=(m.mercato||'').toLowerCase().replace(/\s+/g,' ').trim();
  var pr=(m.pronostico||'').toLowerCase().trim();
  var prUP=(m.pronostico||'').toUpperCase().trim();
  if(prUP==='1X'||prUP==='X2'||prUP==='12')return false;
  var mercatiOK=['1x2','o/u','over/under','gg/ng','mg match','mg casa','mg ospite','multigol'];
  if(mercatiOK.some(function(x){return merc===x||merc.startsWith(x);}))return true;
  if(pr.startsWith('over ')||pr.startsWith('under '))return true;
  if(pr==='gg'||pr==='ng'||pr==='gol'||pr==='nogol'||pr==='no gol')return true;
  if((pr==='1'||pr==='x'||pr==='2')&&merc==='1x2')return true;
  if(merc.includes('mg')||merc.includes('multigol'))return true;
  if(/^\d[-+]\d?$/.test(pr)||/^\d\+$/.test(pr))return true;
  return false;
}
function _isPronosticoDoppia(m){
  var pr=(m.pronostico||'').toUpperCase().replace(/\s+/g,'').trim();
  return pr==='1X'||pr==='X2'||pr==='12';
}

function _costruisciSistema(nFisse, nDoppie) {
  var now   = new Date();
  var oggi0  = new Date(now.getFullYear(), now.getMonth(), now.getDate(),  0,  0,  0).getTime();
  var oggi23 = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59).getTime();

  function tsOf(m) {
    var ds  = nds(m.dataStr || m.data);
    var ora = nora(m.oraStr, m.dataStr || m.data);
    if (!ds || ds === '-') return Infinity;
    var pts = ds.split('/'); if (pts.length < 2) return Infinity;
    var tp  = (ora && ora !== '-') ? ora.split(':') : ['23','59'];
    var yr  = now.getFullYear();
    var mo  = parseInt(pts[1]) - 1;
    if (mo < now.getMonth() - 3) yr++;
    var d = new Date(yr, mo, parseInt(pts[0]), parseInt(tp[0])||0, parseInt(tp[1])||0, 0);
    return isNaN(d.getTime()) ? Infinity : d.getTime();
  }

  var allEntries = [];
  var listeSemplici = ['top5Oggi','top7Prossimi','topSerieA',
    'top7_Corner','top7_Cards','top7_MGCasa','top7_MGOspite',
    'top10_DCOver','topOver35','topMyCombo5'];

  listeSemplici.forEach(function(l) {
    (palinsestoData[l] || []).forEach(function(m) { allEntries.push(m); });
  });
  (palinsestoData.raddoppio || []).forEach(function(card) {
    (card.pick || card.partite || []).forEach(function(m) { allEntries.push(m); });
  });

  var oggi = allEntries.filter(function(m) {
    var ts = tsOf(m);
    return ts >= oggi0 && ts <= oggi23;
  });

  var seenFisse  = {};
  var seenDoppie = {};

  oggi.forEach(function(m) {
    if (!m.casa || m.casa === '-' || !m.pronostico || m.pronostico === '-') return;
    var pr   = m.pronostico.toString().trim();
    var prU  = pr.toUpperCase().replace(/\s+/g, '');
    var merc = (m.mercato || '').toLowerCase();
    var prob = np(m.prob);
    var k    = m.casa + '_' + m.ospite;

    var doppiaStr = '';
    if      (prU === '1X' || prU === 'X2' || prU === '12') doppiaStr = prU;
    else if (merc.includes('dc') || merc.includes('doppia')) {
      if      (prU.includes('1X')) doppiaStr = '1X';
      else if (prU.includes('X2')) doppiaStr = 'X2';
      else if (prU.includes('12')) doppiaStr = '12';
    }
    else if (pr.includes('+')) {
      if      (prU.startsWith('1X')) doppiaStr = '1X';
      else if (prU.startsWith('X2')) doppiaStr = 'X2';
      else if (prU.startsWith('12')) doppiaStr = '12';
    }

    if (doppiaStr) {
      if (!seenDoppie[k] || prob > np((seenDoppie[k] || {}).prob || 0)) {
        seenDoppie[k] = Object.assign({}, m, { pronostico: doppiaStr, prob: Math.max(prob, 65) });
      }
      return;
    }

    if (pr.includes('+')) return;

    var isFissa = false;
    if      (prU === '1' || prU === 'X' || prU === '2')                            isFissa = true;
    else if (merc === '1x2')                                                         isFissa = true;
    else if (merc.includes('o/u') || merc.includes('over') || merc.includes('under')) isFissa = true;
    else if (prU.startsWith('OVER') || prU.startsWith('UNDER'))                     isFissa = true;
    else if (prU === 'GG' || prU === 'NG')                                           isFissa = true;
    else if (merc.includes('mg') || merc.includes('multigol'))                       isFissa = true;
    else if (/^\d[-–]\d/.test(pr) || /^\d\+$/.test(pr))                             isFissa = true;

    if (isFissa && prob > 0) {
      if (!seenFisse[k] || prob > np((seenFisse[k] || {}).prob || 0)) seenFisse[k] = m;
    }
  });

  var candFisse  = Object.values(seenFisse) .sort(function(a,b){ return np(b.prob)-np(a.prob); });
  var candDoppie = Object.values(seenDoppie).sort(function(a,b){ return np(b.prob)-np(a.prob); });

  var fisse = [], doppie = [], usate = new Set();
  for (var i = 0; i < candFisse.length  && fisse.length  < nFisse;  i++) { var kf = candFisse[i].casa  + '_' + candFisse[i].ospite;  if (!usate.has(kf)) { fisse.push(candFisse[i]);   usate.add(kf); } }
  for (var j = 0; j < candDoppie.length && doppie.length < nDoppie; j++) { var kd = candDoppie[j].casa + '_' + candDoppie[j].ospite; if (!usate.has(kd)) { doppie.push(candDoppie[j]); usate.add(kd); } }

  return { fisse: fisse, doppie: doppie, totPartiteOggi: oggi.length };
}

function _htmlSistemaCard(fisse, doppie, tipoLabel, totPartite){
  if(fisse.length<1 && doppie.length<1) return null;
  var tipo=fisse.length+'F'+doppie.length+'D';
  var bollette=Math.pow(2,doppie.length);
  var probFisse = fisse.length > 0 ? fisse.reduce(function(a,p){return a*(np(p.prob)/100);},1) : 1;
  var probFissePerc = fisse.length > 0 ? Math.round(probFisse*1000)/10 : 0;
  var prob1D = doppie.length > 0 ? 1-doppie.reduce(function(a,p){return a*(1-np(p.prob)/100);},1) : 1;
  var prob1DPerc = doppie.length > 0 ? Math.round(prob1D*1000)/10 : 0;
  var probSist = Math.round(probFisse*(doppie.length>0?prob1D:1)*1000)/10;
  var now=new Date();
  var dataOggi=pad(now.getDate())+'/'+pad(now.getMonth()+1)+'/'+now.getFullYear();
  var h='<div class="s3f3d-card">';
  h+='<div class="s3f3d-head"><div><div class="s3f3d-tipo">'+tipoLabel+' '+tipo+' — '+dataOggi+'</div>';
  h+='<div style="font-size:1em;color:rgba(255,255,255,.5);margin-top:3px">'+(totPartite||0)+' partite oggi disponibili · '+bollette+' bollette</div></div>';
  h+='<div style="text-align:right"><span class="s3f3d-prob">'+probSist+'%</span><span class="s3f3d-prob-lbl">P(sistema)</span></div></div>';
  h+='<div class="s3f3d-stats">';
  if(fisse.length > 0) h+='<div class="s3f3d-stat"><div class="s3f3d-stat-val">'+probFissePerc+'%</div><div class="s3f3d-stat-lbl">P(fisse)</div></div>';
  h+='<div class="s3f3d-stat"><div class="s3f3d-stat-val">'+prob1DPerc+'%</div><div class="s3f3d-stat-lbl">P(≥1 doppia)</div></div>';
  h+='<div class="s3f3d-stat"><div class="s3f3d-stat-val">'+bollette+'</div><div class="s3f3d-stat-lbl">Bollette</div></div>';
  h+='</div>';
  if(fisse.length){
    h+='<div class="s3f3d-section">📌 '+fisse.length+(fisse.length===1?' Fissa':' Fisse')+'</div>';
    fisse.forEach(function(p,i){
      var ds=nds(p.dataStr||p.data),ora=nora(p.oraStr,p.dataStr||p.data);
      h+='<div class="s3f3d-match"><div style="flex:1;min-width:0"><div class="s3f3d-teams">'+teamRow(p.casa)+'<span style="color:var(--txt3);font-size:.9em;padding:0 3px">vs</span>'+teamRow(p.ospite)+'</div>';
      h+='<div class="s3f3d-meta">'+getFlag(p)+' '+(p.campionato||'')+' · '+ds+' '+ora+'</div></div>';
      h+='<div style="text-align:right"><div class="s3f3d-prono">'+p.pronostico+'</div><div class="s3f3d-tag">FISSA '+(i+1)+' · '+np(p.prob)+'%</div></div></div>';
    });
  }
  if(doppie.length){
    h+='<div class="s3f3d-section doppie">🔄 '+doppie.length+(doppie.length===1?' Doppia':' Doppie')+' (DC 1X/X2/12)</div>';
    doppie.forEach(function(p,i){
      var ds=nds(p.dataStr||p.data),ora=nora(p.oraStr,p.dataStr||p.data);
      h+='<div class="s3f3d-match"><div style="flex:1;min-width:0"><div class="s3f3d-teams">'+teamRow(p.casa)+'<span style="color:var(--txt3);font-size:.9em;padding:0 3px">vs</span>'+teamRow(p.ospite)+'</div>';
      h+='<div class="s3f3d-meta">'+getFlag(p)+' '+(p.campionato||'')+' · '+ds+' '+ora+'</div></div>';
      h+='<div style="text-align:right"><div class="s3f3d-prono">'+p.pronostico+'</div><div class="s3f3d-tag" style="background:#dbeafe;color:#1e3a8a">DOPPIA '+(i+1)+' · '+np(p.prob)+'%</div></div></div>';
    });
  }
  h+='<div style="padding:1em 1.455em;background:#eff6ff;font-size:0.923em;color:#1e3a8a;line-height:1.5">💡 Sviluppo in multipla integrale. '+(fisse.length===0?'Basta che entrino le doppie.':'Devono entrare tutte le fisse obbligatorie.')+'</div>';
  h+='</div>';
  return h;
}

function spPreviewText(f,d){
  var bollette=Math.pow(2,d);
  var textF = f === 0 ? 'Nessuna fissa, giochi solo le doppie.' : (f + ' fisse obbligatorie.');
  return '📋 Sistema <b>'+f+'F+'+d+'D</b>: '+bollette+' bollette. '+textF;
}
function spStep(tipo,val){
  if(tipo==='f') _spFisse = Math.max(0, Math.min(3, _spFisse+val));
  if(tipo==='d') _spDoppie = Math.max(1, Math.min(6, _spDoppie+val));
  var ef=document.getElementById('spFisse'), ed=document.getElementById('spDoppie');
  if(ef) ef.textContent=_spFisse;
  if(ed) ed.textContent=_spDoppie;
  var prev=document.getElementById('spPreview');
  if(prev) prev.innerHTML=spPreviewText(_spFisse,_spDoppie);
  var btn=document.getElementById('spGenBtn');
  if(btn){btn.textContent='🔵 Genera Sistema '+_spFisse+'F+'+_spDoppie+'D';btn.disabled=false;}
}
function generaSistemaCustom(){
  var res=document.getElementById('spResult');
  res.innerHTML='<div style="text-align:center;padding:2em"><div class="spinner" style="margin:0 auto"></div></div>';
  setTimeout(function(){
    var ris=_costruisciSistema(_spFisse,_spDoppie);
    var card=_htmlSistemaCard(ris.fisse,ris.doppie,'Sistema Personalizzato',ris.totPartiteOggi);
    if(!card){
      var msg='Non abbastanza pronostici oggi. Fisse trovate: '+ris.fisse.length+'/'+_spFisse+'. Doppie trovate: '+ris.doppie.length+'/'+_spDoppie+'.';
      res.innerHTML=emp('⚠️',msg);return;
    }
    res.innerHTML=card;
    res.scrollIntoView({behavior:'smooth',block:'start'});
  },300);
}

  extraBoxesHtml+='</div>';
  return'<div class="op-card" style="animation-delay:'+((idx||0)*0.04)+'s">'+

var _schedN=4;
function renderSchedina(){
  var el=document.getElementById('s-schedina');if(!el)return;
  el.innerHTML='<div class="sec-hdr"><div class="sec-title">💰 Schedina a Richiesta</div><div class="sec-sub">Partite di oggi · Inserisci numero e quota target</div></div>'+
    '<div class="sched-req-card">'+
      '<div class="sched-req-row"><label class="sched-req-label">Numero di partite</label><div class="sched-req-stepper"><button onclick="schedStepper(-1)">−</button><span id="schedNMatch">'+_schedN+'</span><button onclick="schedStepper(1)">+</button></div></div>'+
      '<div class="sched-req-row"><label class="sched-req-label">Quota totale target</label><input type="number" id="schedQuota" value="5.00" min="1.5" max="200" step="0.5" class="sched-req-input" placeholder="es. 5.00"></div>'+
      '<button class="sched-req-btn" onclick="generaSchedina()">⚡ Genera Schedina</button>'+
    '</div><div id="schedResult"></div>';
}
function schedStepper(d){_schedN=Math.max(2,Math.min(10,_schedN+d));var el=document.getElementById('schedNMatch');if(el)el.textContent=_schedN;}
function generaSchedina(){
  var quota=parseFloat(document.getElementById('schedQuota').value)||5.0;
  var n=_schedN;
  var res=document.getElementById('schedResult');
  res.innerHTML='<div style="text-align:center;padding:2.727em"><div class="spinner" style="margin:0 auto"></div></div>';
  var all=getAllMatches().filter(isPartitaFutura).filter(isPartitaOggi).filter(function(m){return m.prob&&np(m.prob)>0;});
  var seen={};var unique=[];
  all.forEach(function(m){var k=m.casa+'_'+m.ospite;if(!seen[k]||(np(m.prob)>np(seen[k].prob))){seen[k]=m;}});
  unique=Object.values(seen);
  if(unique.length<n){res.innerHTML=emp('⚠️','Partite oggi insufficienti ('+unique.length+' disponibili, richieste '+n+').');return;}
  unique.sort(function(a,b){return np(b.prob)-np(a.prob);});
  var targetQuota=quota,bestCombo=null,bestScore=-Infinity;
  var candidati=unique.slice(0,Math.min(30,unique.length));
  function combina(start,correnti,probComb,quotaComb){
    if(correnti.length===n){var distanza=Math.abs(Math.log(quotaComb)-Math.log(targetQuota));var score=probComb*(1/(1+distanza*3));if(score>bestScore){bestScore=score;bestCombo=[].concat(correnti);bestCombo._prob=probComb;bestCombo._quota=quotaComb;}return;}
    var rem=n-correnti.length;if(start+rem>candidati.length)return;
    for(var i=start;i<candidati.length;i++){var m=candidati[i];var p=np(m.prob)/100;var q=m.quota&&m.quota>1?m.quota:(p>0?100/np(m.prob):2.0);combina(i+1,[].concat(correnti,[m]),probComb*p,quotaComb*q);}
  }
  setTimeout(function(){
    combina(0,[],1,1);
    if(!bestCombo){res.innerHTML=emp('❌','Impossibile trovare una combinazione valida');return;}
    var probTot=Math.round(bestCombo._prob*1000)/10,quotaTot=Math.round(bestCombo._quota*100)/100;
    var h='<div class="sched-result-card"><div class="sched-result-head"><div class="sched-result-title">⚡ Schedina Generata (Oggi)</div><div class="sched-result-meta">'+n+' partite · obiettivo '+targetQuota.toFixed(2)+'</div></div>'+
      '<div class="sched-result-stats"><div class="sched-stat-box"><div class="sched-stat-val">'+quotaTot.toFixed(2)+'</div><div class="sched-stat-lbl">Quota tot.</div></div><div class="sched-stat-box"><div class="sched-stat-val green">'+probTot+'%</div><div class="sched-stat-lbl">Prob. comb.</div></div><div class="sched-stat-box"><div class="sched-stat-val '+(Math.abs(quotaTot-targetQuota)<0.5?'green':'orange')+'">'+Math.abs(quotaTot-targetQuota).toFixed(2)+'</div><div class="sched-stat-lbl">Δ quota</div></div></div>';
    bestCombo.forEach(function(m,i){
      var p=np(m.prob);var q=m.quota&&m.quota>1?m.quota.toFixed(2):(p>0?(100/p).toFixed(2):'-');
      var ds=nds(m.dataStr||m.data),ora=nora(m.oraStr,m.dataStr||m.data);
      h+='<div class="sched-result-row"><div class="sched-row-num">'+(i+1)+'</div><div class="sched-row-info"><div class="sched-row-match">'+teamRow(m.casa)+'<span style="color:var(--txt3);padding:0 3px">vs</span>'+teamRow(m.ospite)+'</div><div class="sched-row-meta">'+getFlag(m)+' '+(m.campionato||'')+' · '+ds+' '+ora+'</div></div><div class="sched-row-right"><div class="sched-row-prono">'+m.pronostico+'</div><div class="sched-row-qbox"><span class="sched-row-q">'+q+'</span><span class="sched-row-p">'+p+'%</span></div></div></div>';
    });
    h+='<div class="sched-result-note">💡 Quote implicite. Verifica quelle reali sul bookmaker.</div></div>';
    res.innerHTML=h;res.scrollIntoView({behavior:'smooth',block:'start'});
  },300);
}

function _estraiCandidatiMercati(){
  function isMercatoOK(mercato,pronostico){
    var m=(mercato||'').toLowerCase(),pr=(pronostico||'').toLowerCase();
    if(m.includes('corner')||m.includes('mg')||m.includes('multigol')||m.includes('combo')||m.includes('dc')||m.includes('doppia')||m.includes('mycombo')||m==='1x2'||m.includes('gg')||m.includes('o/u')||m.includes('over')||m.includes('under')||m.includes('tiri')||m.includes('falli'))return true;
    if(pr==='1'||pr==='2'||pr==='x'||pr==='gol'||pr==='nogol')return true;
    return false;
  }
  var all=(getAllMatches()||[]).filter(isPartitaFutura).filter(isPartitaOggi);
  var candidati=all.filter(function(m){return isMercatoOK(m.mercato,m.pronostico)&&m.prob&&np(m.prob)>0;});
  var seen={};
  candidati.forEach(function(c){var k=c.casa+'_'+c.ospite+'_'+(c.mercato||'');if(!seen[k]||np(c.prob)>np(seen[k].prob))seen[k]=c;});
  return Object.values(seen);
}
var _smN=4;
function renderSchedinaMercati(){
  var el=document.getElementById('s-smercati');if(!el)return;
  el.innerHTML='<div class="sec-hdr"><div class="sec-title">📋 Schedina Mercati</div><div class="sec-sub">Solo mercati Sisal · Partite di oggi</div></div>'+
    '<div class="smercati-info">✅ Mercati: 1X2 · GG/NG · O/U · Corner · MG Casa · MG Ospite · Combo · DC+Over</div>'+
    '<div class="sched-req-card">'+
      '<div class="sched-req-row"><label class="sched-req-label">Numero di partite</label><div class="sched-req-stepper"><button onclick="schedinaMStepper(-1)">−</button><span id="smN">'+_smN+'</span><button onclick="schedinaMStepper(1)">+</button></div></div>'+
      '<div class="sched-req-row"><label class="sched-req-label">Quota target</label><input type="number" id="smQuota" value="5.00" min="1.5" max="200" step="0.5" class="sched-req-input" placeholder="es. 5.00"></div>'+
      '<button class="sched-req-btn" style="background:linear-gradient(135deg,#7c3aed,#4a1942)" onclick="generaSchedinaMercati()">📋 Genera Schedina Mercati</button>'+
    '</div><div id="smResult"></div>';
}
function schedinaMStepper(d){_smN=Math.max(2,Math.min(10,_smN+d));var el=document.getElementById('smN');if(el)el.textContent=_smN;}
function generaSchedinaMercati(){
  var quota=parseFloat(document.getElementById('smQuota').value)||5.0;
  var n=_smN;var res=document.getElementById('smResult');
  res.innerHTML='<div style="text-align:center;padding:2.727em"><div class="spinner" style="margin:0 auto"></div></div>';
  setTimeout(function(){
    var candidati=_estraiCandidatiMercati();
    if(candidati.length<n){res.innerHTML=emp('⚠️','Partite oggi insufficienti ('+candidati.length+' disponibili)');return;}
    var seen2={};var unique=[];
    candidati.forEach(function(c){var k=c.casa+'_'+c.ospite;if(!seen2[k]||np(c.prob)>np(seen2[k].prob))seen2[k]=c;});
    unique=Object.values(seen2).sort(function(a,b){return np(b.prob)-np(a.prob);});
    if(unique.length<n){res.innerHTML=emp('⚠️','Partite uniche insufficienti ('+unique.length+')');return;}
    var bestCombo=null,bestScore=-Infinity;
    var pool=unique.slice(0,Math.min(25,unique.length));
    function combina(start,correnti,probComb,quotaComb){
      if(correnti.length===n){var dist=Math.abs(Math.log(quotaComb)-Math.log(quota));var score=probComb*(1/(1+dist*3));if(score>bestScore){bestScore=score;bestCombo=[].concat(correnti);bestCombo._prob=probComb;bestCombo._quota=quotaComb;}return;}
      var rem=n-correnti.length;if(start+rem>pool.length)return;
      for(var i=start;i<pool.length;i++){var m=pool[i];var p=np(m.prob)/100;var q=m.quota&&m.quota>1?m.quota:(p>0?1/p:2.0);combina(i+1,[].concat(correnti,[m]),probComb*p,quotaComb*q);}
    }
    combina(0,[],1,1);
    if(!bestCombo){res.innerHTML=emp('❌','Nessuna combinazione trovata');return;}
    var probTot=Math.round(bestCombo._prob*1000)/10,quotaTot=Math.round(bestCombo._quota*100)/100;
    var h='<div class="sched-result-card" style="border-color:#7c3aed"><div class="sched-result-head" style="background:linear-gradient(135deg,#4a1942,#7c3aed)"><div class="sched-result-title">📋 Schedina Mercati (Oggi)</div><div class="sched-result-meta">'+n+' partite · target '+quota.toFixed(2)+'</div></div>'+

    bestCombo.forEach(function(m,i){
      var p=np(m.prob);var q=m.quota&&m.quota>1?m.quota.toFixed(2):(p>0?(100/p).toFixed(2):'-');
      var ds=nds(m.dataStr||m.data),ora=nora(m.oraStr,m.dataStr||m.data);
      h+='<div class="sched-result-row"><div class="sched-row-num">'+(i+1)+'</div><div class="sched-row-info"><div class="sched-row-match">'+teamRow(m.casa)+'<span style="color:var(--txt3);padding:0 3px">vs</span>'+teamRow(m.ospite)+'</div><div class="sched-row-meta">'+getFlag(m)+' '+(m.campionato||'')+' · '+ds+' '+ora+'</div></div><div class="sched-row-right"><div style="background:#ede9fe;color:#5b21b6;font-size:0.818em;font-weight:800;padding:0.182em 0.545em;border-radius:0.727em;text-align:right">'+(m.mercato||'—')+'</div><div class="sched-row-prono" style="color:#7c3aed">'+m.pronostico+'</div><div class="sched-row-qbox"><span class="sched-row-q" style="background:#7c3aed">'+q+'</span><span class="sched-row-p">'+p+'%</span></div></div></div>';
    });
    h+='<div class="sched-result-note">💡 Quote implicite. Verifica quelle reali sul bookmaker.</div></div>';
    res.innerHTML=h;res.scrollIntoView({behavior:'smooth',block:'start'});
  },300);

  var lega=document.getElementById('scLega').value;

    if(selMerc.length>0)pool=pool.filter(function(m){var merc=(m.mercato||'').toLowerCase();return selMerc.some(function(s){return merc.includes(s.toLowerCase());});});
    var seenP={};
    pool.forEach(function(m){var k=m.casa+'_'+m.ospite;if(!seenP[k]||np(m.prob)>np(seenP[k].prob))seenP[k]=m;});
    var unici=Object.values(seenP).sort(function(a,b){return np(b.prob)-np(a.prob);});
    if(unici.length<n){res.innerHTML=emp('⚠️','Solo '+unici.length+' pronostici oggi'+(lega?' per '+lega:'')+'.');return;}
    var bestCombo=null,bestScore=-Infinity;
    var candidates=unici.slice(0,Math.min(30,unici.length));
    function combina(start,correnti,probC,quotaC){
      if(correnti.length===n){var dist=Math.abs(Math.log(quotaC)-Math.log(quota));var score=probC*(1/(1+dist*3));if(score>bestScore){bestScore=score;bestCombo=[].concat(correnti);bestCombo._prob=probC;bestCombo._quota=quotaC;}return;}
      var rem=n-correnti.length;if(start+rem>candidates.length)return;
      for(var i=start;i<candidates.length;i++){var m=candidates[i];var p=np(m.prob)/100;var q=m.quota&&m.quota>1?m.quota:(p>0?1/p:2.0);combina(i+1,[].concat(correnti,[m]),probC*p,quotaC*q);}
    }
    combina(0,[],1,1);
    if(!bestCombo){res.innerHTML=emp('❌','Impossibile trovare combinazione valida');return;}
    var probTot=Math.round(bestCombo._prob*1000)/10,quotaTot=Math.round(bestCombo._quota*100)/100;
    var legaLabel=lega||(selMerc.length?selMerc.join(', '):'Tutti i campionati di oggi');
    var h='<div class="sched-result-card" style="border-color:#0d9488"><div class="sched-result-head" style="background:linear-gradient(135deg,#134e4a,#0d9488)"><div class="sched-result-title">🏆 '+legaLabel+'</div><div class="sched-result-meta">'+n+' pronostici · target '+quota.toFixed(2)+'</div></div>'+
      '<div class="sched-result-stats"><div class="sched-stat-box"><div class="sched-stat-val">'+quotaTot.toFixed(2)+'</div><div class="sched-stat-lbl">Quota</div></div><div class="sched-stat-box"><div class="sched-stat-val green">'+probTot+'%</div><div class="sched-stat-lbl">Prob.</div></div><div class="sched-stat-box"><div class="sched-stat-val '+(Math.abs(quotaTot-quota)<1?'green':'orange')+'">'+Math.abs(quotaTot-quota).toFixed(2)+'</div><div class="sched-stat-lbl">Δ</div></div></div>';
    bestCombo.forEach(function(m,i){
      var p=np(m.prob);var q=m.quota&&m.quota>1?m.quota.toFixed(2):(p>0?(100/p).toFixed(2):'-');
      var ds=nds(m.dataStr||m.data),ora=nora(m.oraStr,m.dataStr||m.data);
      h+='<div class="sched-result-row"><div class="sched-row-num">'+(i+1)+'</div><div class="sched-row-info"><div class="sched-row-match">'+teamRow(m.casa)+'<span style="color:var(--txt3);padding:0 3px">vs</span>'+teamRow(m.ospite)+'</div><div class="sched-row-meta">'+getFlag(m)+' '+(m.campionato||'')+' · '+ds+' '+ora+'</div></div><div class="sched-row-right"><div style="background:#ccfbf1;color:#0f766e;font-size:0.818em;font-weight:800;padding:0.182em 0.545em;border-radius:0.727em;text-align:right">'+(m.mercato||'—')+'</div><div class="sched-row-prono" style="color:#0d9488">'+m.pronostico+'</div><div class="sched-row-qbox"><span class="sched-row-q" style="background:#0d9488">'+q+'</span><span class="sched-row-p">'+p+'%</span></div></div></div>';
    });
    h+='<div class="sched-result-note">💡 Quote implicite. Verifica quelle reali sul bookmaker.</div></div>';
    res.innerHTML=h;res.scrollIntoView({behavior:'smooth',block:'start'});
  },300);
}

// LEAGUE FILTER

var activeLeagueFilter='all';
function updateLeagueFilters(){
  var allData=getAllMatches();var seen={},leagues=[];
  allData.forEach(function(m){if(m&&m.campionato&&!seen[m.campionato]){seen[m.campionato]=true;leagues.push({flag:getFlag(m),name:m.campionato});}});
  var html='<button class="filter-pill active" data-ln="all">🌍 Tutti</button>';
  leagues.forEach(function(l){html+='<button class="filter-pill" data-ln="'+l.name.replace(/"/g,'&quot;')+'">'+l.flag+' '+l.name+'</button>';});
  var container=document.getElementById('filterInner');container.innerHTML=html;
  container.onclick=function(e){
    var btn=e.target.closest('.filter-pill');if(!btn)return;
    container.querySelectorAll('.filter-pill').forEach(function(p){p.classList.remove('active');});
    btn.classList.add('active');var name=btn.getAttribute('data-ln');activeLeagueFilter=name;
    if(name!=='all'){renderLeagueView(name);activateSection('s-league');}
    else{renderTutto();if(currentSection==='s-league')activateSection('s-top5');}
  };
}
function renderLeagueView(leagueName){
  var el=document.getElementById('s-league');
  var all=getAllMatches().filter(function(m){return m.campionato===leagueName;});
  if(activeDateFilter!=='all')all=all.filter(function(m){return nds(m.dataStr||m.data)===activeDateFilter;});
  var seen={};var unique=[];
  all.forEach(function(m){var k=(m.casa||'')+'_'+(m.ospite||'')+'_'+(m.mercato||'')+'_'+(m.pronostico||'');if(!seen[k]){seen[k]=true;unique.push(m);}});
  var byMatch={};
  unique.forEach(function(m){var key=(m.casa||'')+' vs '+(m.ospite||'');if(!byMatch[key])byMatch[key]={casa:m.casa,ospite:m.ospite,dataStr:m.dataStr,oraStr:m.oraStr,data:m.data,predictions:[]};byMatch[key].predictions.push(m);});
  var matchList=Object.values(byMatch);
  var flag=matchList.length>0?getFlag(matchList[0].predictions[0]):'🏆';
  if(!matchList.length){el.innerHTML='<div class="sec-hdr"><div class="sec-title">'+flag+' '+leagueName+'</div></div>'+emp('🏆','Nessun pronostico');return;}
  var h='<div class="sec-hdr"><div class="sec-title">'+flag+' '+leagueName+'</div><div class="sec-sub">'+matchList.length+' partite</div></div>';
  matchList.forEach(function(match){
    var ds=nds(match.dataStr||match.data),ora=nora(match.oraStr,match.dataStr||match.data);
    h+='<div style="background:#fff;border-radius:1.273em;margin-bottom:1.091em;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.07)"><div style="background:var(--dark);padding:1.182em 1.455em;display:flex;justify-content:space-between;align-items:center"><div><div style="color:#fff;font-size:1.385em;font-weight:800">'+teamRow(match.casa,"font-size:1.231em;font-weight:800;color:#fff")+'</div><div style="color:rgba(255,255,255,.75);font-size:1.077em;font-weight:600">'+teamRow(match.ospite,"font-size:1.077em;font-weight:600;color:rgba(255,255,255,.75)")+'</div></div><div style="text-align:right;color:rgba(255,255,255,.5);font-size:1em">'+ds+'<br>'+ora+'</div></div>';
    match.predictions.sort(function(a,b){return np(b.prob)-np(a.prob);}).forEach(function(m){
      var p=np(m.prob),q=qDisplay(m);
      h+='<div style="display:flex;align-items:center;justify-content:space-between;padding:1em 1.455em;border-bottom:1px solid #f0f0f5;gap:0.818em"><div style="display:flex;align-items:center;gap:0.636em;flex:1;min-width:0"><span class="sa-mercato-badge '+getMBClass(m.mercato)+'">'+m.mercato+'</span><span style="font-size:1.077em;font-weight:800">'+m.pronostico+'</span></div><div style="display:flex;gap:0.636em;flex-shrink:0"><div style="width:4.545em;background:#f6f6fa;border:1px solid #e0e0ea;border-radius:1.091em;padding:0.364em;text-align:center"><div style="font-size:0.846em;font-weight:700;color:var(--txt3);text-transform:uppercase">Prob</div><div style="font-size:1.538em;font-weight:800;color:var(--txt)">'+p+'%</div></div><div style="width:4.545em;background:'+(q.isReal?'#dcfce7':'#f6f6fa')+';border:1px solid '+(q.isReal?'#bbf7d0':'#e0e0ea')+';border-radius:1.091em;padding:0.364em;text-align:center"><div style="font-size:0.846em;font-weight:700;color:var(--txt3);text-transform:uppercase">'+(q.isReal?'✓':'Quota')+'</div><div style="font-size:1.538em;font-weight:800;color:'+(q.isReal?'#166534':'var(--txt)')+'">'+q.val+'</div></div></div></div>';
    });
    h+='</div>';
  });
  el.innerHTML=h;
}
